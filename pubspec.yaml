name: qatrah
description: Qatrah — water schedule, complaints, and notifications platform.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  bloc: ^9.0.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  dartz: ^0.10.1
  dio: ^5.9.0
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  get_it: ^9.2.0
  go_router: ^17.0.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  url_launcher: ^6.3.2
  vector_graphics: ^1.1.19
  hugeicons:
  pinput: ^6.0.2
  skeletonizer: ^2.1.0+1
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0
  bot_toast: ^4.1.3
  shared_preferences: ^2.3.3
  permission_handler: ^12.0.1
  package_info_plus: ^10.1.0
  in_app_update: ^4.2.5
  local_auth: ^3.0.1
  cryptography: ^2.7.0
  share_plus: ^13.1.0

dev_dependencies:
  vector_graphics_compiler: 1.1.20
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0
  test: ^1.26.2
  http_mock_adapter: ^0.6.1

  build_runner: ^2.4.0
  json_serializable: ^6.11.2

dependency_overrides:
  permission_handler_android: 12.1.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
    - path: assets/icons/
      transformers:
        - package: vector_graphics_compiler
  fonts:
    - family: ITF Qomra Arabic
      fonts:
        - asset: assets/fonts/itfQomraArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/itfQomraArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/itfQomraArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/itfQomraArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/itfQomraArabic-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
  flavors:
    development:
      image_path: assets/images/app_icon.png
    staging:
      image_path: assets/images/app_icon.png
    production:
      image_path: assets/images/app_icon.png
