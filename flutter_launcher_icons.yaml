# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 21 # android min sdk min:16, default 21
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"

  flavors:
    development:
      image_path: "assets/images/app_icon.png"
    staging:
      image_path: "assets/images/app_icon.png"
    production:
      image_path: "assets/images/app_icon.png"
